# Nginx para INDUFOR (ADR-005). Reemplazar indufor.example por el dominio real y ajustar rutas.
# Certificados: Let's Encrypt (certbot --nginx). Todo el tráfico HTTP se redirige a HTTPS.

server {
    listen 80;
    server_name app.indufor.example api.indufor.example;
    return 301 https://$host$request_uri;
}

# ── SPA (PWA) ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.indufor.example;
    root /var/www/indufor-app;          # destino de deploy/scripts/deploy.sh (WEB_ROOT)
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/app.indufor.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.indufor.example/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # La foto de la planilla usa la cámara del celular (RF04)
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # style 'unsafe-inline': los avisos (sonner) inyectan estilos; los scripts solo del propio origen
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.indufor.example; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # El service worker y el HTML nunca se cachean: así llega la actualización de la PWA
    location = /sw.js         { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html    { add_header Cache-Control "no-cache"; }
    location /assets/         { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /                { try_files $uri $uri/ /index.html; }
}

# ── API Laravel ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.indufor.example;
    root /srv/indufor/backend/public;   # solo public/ queda expuesto
    index index.php;
    client_max_body_size 10m;           # fotos (8 MB) y CSV (2 MB)

    ssl_certificate     /etc/letsencrypt/live/api.indufor.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.indufor.example/privkey.pem;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) { deny all; }
}
